name: SURC U63 targeted rank v034
on:
  push:
    branches: [research/surc-u56-v034]
    paths:
      - '.github/workflows/surc-u56-v034.yml'
      - 'research/surc/u63_targeted_rank.sage'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/surc-u56-v034.yml'
      - 'research/surc/u63_targeted_rank.sage'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/surc-u56-v034
      - name: Run targeted exact audit
        shell: bash
        run: |
          mkdir -p research/surc/results-u63-targeted
          sage research/surc/u63_targeted_rank.sage > research/surc/results-u63-targeted/u63_targeted_rank.log 2>&1
          cp research/surc/u63_targeted_rank.json research/surc/results-u63-targeted/
          sage --version > research/surc/results-u63-targeted/environment.txt
          sha256sum research/surc/u63_targeted_rank.sage >> research/surc/results-u63-targeted/environment.txt
          git rev-parse HEAD >> research/surc/results-u63-targeted/environment.txt
      - name: Upload exact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surc-u63-targeted-v034
          path: research/surc/results-u63-targeted/
          if-no-files-found: error
          retention-days: 90
