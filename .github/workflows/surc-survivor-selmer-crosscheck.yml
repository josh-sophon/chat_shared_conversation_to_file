name: SURC survivor Selmer crosscheck
on:
  push:
    branches: [research/surc-survivors-v032]
    paths:
      - '.github/workflows/surc-survivor-selmer-crosscheck.yml'
      - 'research/surc/survivor_selmer_crosscheck.sage'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/surc-survivor-selmer-crosscheck.yml'
      - 'research/surc/survivor_selmer_crosscheck.sage'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crosscheck:
    strategy:
      fail-fast: false
      matrix:
        U: [43,47,50]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/surc-survivors-v032
      - name: Run Selmer crosscheck
        shell: bash
        run: |
          mkdir -p research/surc/results-selmer
          out="research/surc/results-selmer/U${{ matrix.U }}.json"
          sage research/surc/survivor_selmer_crosscheck.sage '${{ matrix.U }}' "$out" > "${out%.json}.log" 2>&1
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surc-selmer-U${{ matrix.U }}
          path: research/surc/results-selmer/
          if-no-files-found: error
          retention-days: 90
