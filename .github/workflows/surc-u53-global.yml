name: SURC U53 exact rank
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/surc-u53-global.yml'
      - 'research/surc/u53_global.sage'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/surc-u53-v033
      - name: Run exact U53 rank and saturated-basis computation
        shell: bash
        run: |
          mkdir -p research/surc/results-u53
          sage research/surc/u53_global.sage rank-pari 10 > research/surc/results-u53/rank-pari-10.log 2>&1
      - name: Upload exact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surc-u53-rank-pari-10
          path: research/surc/results-u53/
          if-no-files-found: error
          retention-days: 90
